<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 452" width="1400" height="452" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="c2" x="-4%" y="-30%" width="108%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#8ba0bd" flood-opacity="0.15"/>
    </filter>
    <g id="swap" fill="none" stroke="#4d6bfe" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6.5 h11 l-3 -3"/><path d="M15 11.5 h-11 l3 3"/>
    </g>
    <g id="bolt" fill="none" stroke="#4d6bfe" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 2 L4.5 10 H9 L8 16 L13.5 8 H9 Z"/>
    </g>
    <g id="box" fill="none" stroke="#18a058" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 5.5 L9 2.2 L15.5 5.5 v7 L9 15.8 L2.5 12.5 Z"/><path d="M2.5 5.5 L9 8.8 L15.5 5.5"/><line x1="9" y1="8.8" x2="9" y2="15.8"/>
    </g>
    <g id="par" fill="none" stroke="#18a058" stroke-width="1.7" stroke-linecap="round">
      <line x1="4" y1="3.5" x2="4" y2="14.5"/><line x1="9" y1="3.5" x2="9" y2="14.5"/><line x1="14" y1="3.5" x2="14" y2="14.5"/>
    </g>
    <path id="arrowB" d="M0 0 h22 m-7 -5 l7 5 l-7 5" fill="none" stroke="#4d6bfe" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="arrowG" d="M0 0 h22 m-7 -5 l7 5 l-7 5" fill="none" stroke="#18a058" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <rect width="1400" height="452" fill="#ffffff"/>

  <text x="86" y="44" fill="#94a3b8" font-size="11.5" letter-spacing="1.7" font-weight="600">WHAT YOU NEED</text>
  <text x="654" y="44" fill="#94a3b8" font-size="11.5" letter-spacing="1.7" font-weight="600">WHAT TO DO</text>

  <!-- row 1 -->
  <rect x="60" y="62" width="1280" height="66" rx="12" fill="#f7faff" stroke="#d9e3fb" filter="url(#c2)"/>
  <text x="86" y="101" fill="#3d4756" font-size="14">another model's read on something</text>
  <line x1="568" y1="80" x2="568" y2="110" stroke="#d9e3fb"/>
  <use href="#arrowB" x="596" y="95"/>
  <use href="#swap" x="644" y="86"/>
  <text x="674" y="90" fill="#1c2431" font-size="14" font-weight="650">Switch models in your own session</text>
  <text x="674" y="110" fill="#6b7787" font-size="11.5">one flag · no plugin · no background job · no overhead</text>

  <!-- row 2 -->
  <rect x="60" y="144" width="1280" height="66" rx="12" fill="#f7faff" stroke="#d9e3fb" filter="url(#c2)"/>
  <text x="86" y="183" fill="#3d4756" font-size="14">it to finish sooner</text>
  <line x1="568" y1="162" x2="568" y2="192" stroke="#d9e3fb"/>
  <use href="#arrowB" x="596" y="177"/>
  <use href="#bolt" x="644" y="168"/>
  <text x="674" y="172" fill="#1c2431" font-size="14" font-weight="650">Do it inline</text>
  <text x="674" y="192" fill="#6b7787" font-size="11.5">delegation costs about 23% more wall clock, measured</text>

  <!-- row 3 -->
  <rect x="60" y="226" width="1280" height="66" rx="12" fill="#f4fbf6" stroke="#c7e8d3" filter="url(#c2)"/>
  <text x="86" y="254" fill="#3d4756" font-size="14">a large investigation that</text>
  <text x="86" y="274" fill="#3d4756" font-size="14">would eat your own context</text>
  <line x1="568" y1="244" x2="568" y2="274" stroke="#c7e8d3"/>
  <use href="#arrowG" x="596" y="259"/>
  <use href="#box" x="644" y="250"/>
  <text x="674" y="254" fill="#1c2431" font-size="14" font-weight="650">Delegate</text>
  <text x="674" y="274" fill="#6b7787" font-size="11.5">the search stays in its context — 49.6k tokens against 70.6k inline</text>

  <!-- row 4 -->
  <rect x="60" y="308" width="1280" height="66" rx="12" fill="#f4fbf6" stroke="#c7e8d3" filter="url(#c2)"/>
  <text x="86" y="336" fill="#3d4756" font-size="14">several independent things</text>
  <text x="86" y="356" fill="#3d4756" font-size="14">running at once</text>
  <line x1="568" y1="326" x2="568" y2="356" stroke="#c7e8d3"/>
  <use href="#arrowG" x="596" y="341"/>
  <use href="#par" x="644" y="332"/>
  <text x="674" y="336" fill="#1c2431" font-size="14" font-weight="650">Delegate</text>
  <text x="674" y="356" fill="#6b7787" font-size="11.5">jobs are detached processes; a single session works serially</text>

  <line x1="60" y1="404" x2="1340" y2="404" stroke="#eaeef4"/>
  <text x="60" y="430" fill="#94a3b8" font-size="11.5">Delegation buys context separation and parallelism. It never buys latency — turn on <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7787">DSH_STAFF_THINKING=off</tspan> before measuring any of this.</text>
</svg>
