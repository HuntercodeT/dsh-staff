name: Generated skills consistency
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consistency:
    name: Generated skills consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pi-skills/ is generated from skills/; this fails if the two have drifted.
      - run: node scripts/generate-pi-skills.mjs --check
      # No test job: the inherited suite is unported (see legacy-tests/README.md).
      - name: Syntax check
        run: |
          for f in companion/*.mjs companion/providers/*.mjs runner/*.mjs scripts/*.mjs; do
            node --check "$f"
          done
